<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>ProLens</title>

    <!-- Apply the saved theme before first paint so a refresh doesn't flash
         white in dark mode. Mirrors UIProvider (src/app/providers.tsx): the
         stored value is "light" | "dark" | "system", defaulting to dark, and
         /login is always light. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("prolens_theme") || "dark";
          var dark =
            location.pathname !== "/login" &&
            (stored === "dark" ||
              (stored === "system" &&
                matchMedia("(prefers-color-scheme: dark)").matches));
          document.documentElement.classList.add(dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <!-- Same colours as --canvas-bg in src/styles/tokens.css; the app CSS
         isn't loaded yet at this point. -->
    <style>
      html.light {
        background-color: #eef1f5;
        color-scheme: light;
      }
      html.dark {
        background-color: #0a0b0d;
        color-scheme: dark;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
